    - { src: /images/carruseles/liderazgo-ejecutivo/6.webp, alt: "Liderazgo Ejecutivo: coaching individual para líderes y coaching grupal para equipos, a medida. Es pago: el arancel te lo paso por WhatsApp." }
    - { src: /images/carruseles/liderazgo-ejecutivo/7.webp, alt: "Para quién es: líderes y gerentes, mandos medios con equipo nuevo, dueños de pymes y equipos que quieren coordinarse mejor." }
    - { src: /images/carruseles/liderazgo-ejecutivo/8.webp, alt: "¿Cuántas respuestas distintas te salieron? Contámelo en los comentarios. Leo cada uno." }

# Es un servicio para líderes y equipos, no un curso: el bloque "Cómo es estudiar en el Instituto" no aplica.
instituto: false

oferta:
  titulo: Conversemos sobre tu equipo
  destacado: Coaching individual o grupal, a medida
  texto: Es una propuesta paga. Primero conversamos sobre tu situación y tus objetivos; con eso te pasamos por WhatsApp una propuesta con formato, frecuencia y arancel.

preguntas:
  - pregunta: ¿Cómo empiezo?
    respuesta: Tocá «Pedir una consulta» y dejá tus datos. Te escribimos por WhatsApp para entender qué necesitás y armar una propuesta.
  - pregunta: ¿Es para una persona o para un equipo?
    respuesta: Para las dos cosas. Puede ser coaching ejecutivo individual para quien lidera, o coaching grupal para un equipo completo.
  - pregunta: ¿Cuánto dura un proceso?
    respuesta: Depende del objetivo y de si es individual o grupal. Lo definimos juntos en la primera conversación, antes de empezar.
  - pregunta: ¿Cuánto cuesta?
    respuesta: Es una propuesta paga y el arancel depende del formato. Te lo pasamos por WhatsApp junto con la propuesta.
  - pregunta: ¿Hay algo para empezar solo, a mi ritmo?
    respuesta: Sí. El curso online Optimización y Planificación del Tiempo es parte del área de liderazgo y lo hacés a tu ritmo. Si te interesa, escribinos y te pasamos el enlace.

cierre:
  titulo: Un equipo alineado empieza con una conversación
  texto: Dejá tus datos y te escribimos por WhatsApp para conocer a tu equipo y contarte cómo trabajamos.

reserva:
  titulo: Quiero consultar por Liderazgo Ejecutivo
  texto: Dejanos tus datos y te escribimos por WhatsApp para conversar sobre tu equipo y tus objetivos.
  gracias: Te vamos a escribir para conocer tu situación y pasarte una propuesta. Si querés, podés escribirnos ahora por WhatsApp.
