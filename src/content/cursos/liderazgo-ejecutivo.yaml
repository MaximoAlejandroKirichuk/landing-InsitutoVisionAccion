    - { src: /images/carruseles/liderazgo-ejecutivo/2.webp, alt: "Casi nunca es falta de ganas. Muchas veces cada persona tiene en la cabeza un objetivo distinto, y nadie lo dijo en voz alta." }
    - { src: /images/carruseles/liderazgo-ejecutivo/3.webp, alt: "Un ejercicio: en la próxima reunión, pedí que cada persona escriba en un papel cuál es el objetivo más importante del equipo este mes." }
    - { src: /images/carruseles/liderazgo-ejecutivo/4.webp, alt: "Leanlos en voz alta. Si aparecen respuestas distintas, no es un problema: es el punto de partida." }
