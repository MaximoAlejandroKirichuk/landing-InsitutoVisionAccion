    - periodo: Arancel
      valores: [$6.000 en Argentina]

preguntas:
  - pregunta: ¿Qué son las sanaciones populares?
    respuesta: Son prácticas de sanación de la tradición popular, con hierbas, rituales y técnicas que pasaron de generación en generación, muchas veces de abuelas a nietas.
  - pregunta: ¿Cómo es el taller?
    respuesta: Es un material en PDF para descargar y leer a tu ritmo. Tenés acceso durante 30 días corridos desde que te inscribís. Después de ese plazo el acceso vence, así que conviene descargarlo.
  - pregunta: ¿Necesito saber algo antes?
    respuesta: No. Es para todos los niveles, podés empezar desde cero.
  - pregunta: ¿Recibo un certificado?
    respuesta: Sí, un certificado de participación del Instituto. Es una formación de educación no formal.
  - pregunta: ¿Cuánto cuesta?
    respuesta: El taller cuesta $6.000. Te pasamos las formas de pago por WhatsApp.
  - pregunta: ¿Reemplaza un tratamiento médico?
    respuesta: No. Son saberes de tradición cultural y complementarios. No reemplazan la atención médica ni psicológica. Ante cualquier síntoma, consultá a tu médico.

cierre:
  titulo: Lo que se cuenta, no se pierde.
  texto: Dejá tus datos y te escribimos para enviarte el acceso al Taller de Sanaciones Populares.

reserva:
  titulo: Inscribite al Taller de Sanaciones Populares
  texto: Dejanos tus datos y te escribimos por WhatsApp con las formas de pago y el acceso al taller.
  gracias: Te vamos a escribir para confirmar tu inscripción. Si querés, podés escribirnos ahora por WhatsApp.
