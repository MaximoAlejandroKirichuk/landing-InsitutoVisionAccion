gancho:
  frase: Mi abuela curaba el empacho… y nunca le pregunté cómo.
  texto: Esos saberes pasaban de abuelas a nietas, en la cocina, sin nada escrito. Muchos se están perdiendo porque nadie los anotó. Conocerlos es una forma de recuperar una parte de tu historia, y de tener algo para contarles a tus hijos y a tus nietos.

cursada:
  - etiqueta: Formato
    valor: Material en PDF para descargar
  - etiqueta: Cuándo
    valor: A tu ritmo, sin horarios
  - etiqueta: Acceso
    valor: 30 días corridos desde la inscripción
  - etiqueta: Nivel
    valor: Todos los niveles, desde cero

paraQuien:
  titulo: ¿Para quién es este taller?
  items:
    - Creciste viendo a tu abuela o a tu mamá curar con hierbas, cintas o palabras, y te quedaron preguntas.
    - Querés conservar esos saberes antes de que se pierdan, y poder contárselos a tus hijos y nietos.
    - Te interesan las tradiciones de sanación de nuestra cultura y querés conocerlas con más detalle.
    - Ya trabajás con terapias holísticas y querés sumar este conocimiento.
  cierre: Si te reconocés en alguna, este taller está pensado para vos.

programa:
  titulo: Qué vas a ver
  texto: Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: hierbas-y-remedios
      icono: biodescodificacion
      titulo: Hierbas y remedios naturales
      resumen: Las plantas que se usaban en casa y para qué.
      descripcion: Las hierbas y preparaciones que formaban parte de la vida cotidiana en muchas familias, y el sentido que tenían dentro de cada tradición.
    - id: rituales-ancestrales
      icono: hipnosis
      titulo: Rituales y prácticas de sanación ancestral
      resumen: Lo que hacían nuestras abuelas, contado paso a paso.
      descripcion: Prácticas tradicionales que pasaron de generación en generación, de boca en boca. Qué se hacía, cómo y con qué intención.
    - id: naturaleza
      icono: coaching
      titulo: La conexión con la naturaleza
      resumen: La mirada de estas tradiciones sobre la naturaleza.
      descripcion: Cómo entienden estos saberes la relación entre las personas y la naturaleza, y por qué la consideran una fuente de bienestar.
    - id: cuerpo-mente-espiritu
      icono: tarot
      titulo: Armonizar cuerpo, mente y espíritu
      resumen: Técnicas tradicionales para el bienestar integral.
      descripcion: Técnicas que estas tradiciones usan para buscar armonía y equilibrio. Son saberes culturales y complementarios, no un tratamiento médico.

