# Mindfulness → https://sitio/mindfulness/
# Datos del sitio oficial (tarjeta "Mindfulness: atención plena, respiración y herramientas para el bienestar cotidiano")
# y de los carruseles de Canva (membresía y práctica de 5 minutos). El sitio no publica formato, duración ni precio
# del curso: por eso el arancel se pasa por WhatsApp. Confirmar con Fernanda antes de pautar.

nombre: Mindfulness
orden: 30
mostrarEnHome: false
animacion: mindfulness

seo:
  titulo: Mindfulness | Instituto Visión en Acción
  descripcion: Atención plena, respiración y herramientas simples para el bienestar cotidiano, con Fernanda Rodríguez. Prácticas cortas para frenar y volver a vos. Es una propuesta paga.

tarjeta:
  etiqueta: Curso · Atención plena
  resumen: Atención plena, respiración y herramientas simples para el bienestar cotidiano.
  boton: Conocer el curso

whatsapp:
  mensaje: Hola, quisiera conocer el arancel y cómo es el curso de Mindfulness.

hero:
  bajada: Prácticas simples de atención plena y respiración para frenar, escucharte y volver a vos. Cinco minutos alcanzan para empezar.
  datos:
    - Desde cero
    - Online, a tu ritmo
    - Con Fernanda Rodríguez
