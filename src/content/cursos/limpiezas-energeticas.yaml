gancho:
  frase: Después de cada discusión, siento la casa pesada.
  texto: Hay días en que el ambiente queda cargado, aunque nadie diga nada. Desde lo energético, los espacios también guardan lo que vivimos en ellos. Un ritual simple, hecho con intención, es una forma de cerrar ese momento y volver a empezar. Y de hacerte un lugar para vos.

cursada:
  - etiqueta: Formato
    valor: Material en PDF descargable
  - etiqueta: Cuándo
    valor: Cuando quieras, a tu ritmo
  - etiqueta: Acceso
    valor: 30 días para descargar el material

paraQuien:
  titulo: ¿Para quién es este taller?
  items:
    - Sentís el ambiente de tu casa pesado y no sabés por dónde empezar.
    - Después de una discusión o de una visita difícil, querés cerrar el momento y renovar el espacio.
    - Estás atravesando un cambio, una pérdida o una etapa en la que sentís que nada se mueve.
    - Te gustan los rituales y querés aprenderlos bien, paso a paso.
    - Ya practicás meditación, tarot o reiki y querés sumar herramientas.
  cierre: Si te reconocés en alguna, este taller es un buen comienzo.

programa:
  titulo: Qué vas a aprender
  texto: Herramientas prácticas y fáciles de aplicar en tu día a día. Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: limpieza-del-hogar
      icono: hipnosis
      titulo: Limpieza energética de tu casa
      resumen: Para cuando el ambiente se siente cargado.
      descripcion: Rituales simples de limpieza para tus espacios, con elementos que tenés a mano. Cómo prepararte, en qué orden hacerlos y cómo cerrarlos.
    - id: limpieza-personal
      icono: biodescodificacion
      titulo: Tu propia energía
      resumen: Un momento para vos, después de un día difícil.
      descripcion: Prácticas para soltar lo que cargaste en el día y volver a tu centro. Un ritual también es una forma de cuidarte.
    - id: apertura-de-caminos
      icono: coaching
      titulo: Rituales de apertura de caminos
      resumen: Para acompañar un cambio o un nuevo comienzo.
      descripcion: Rituales tradicionales que se usan para acompañar etapas nuevas, búsquedas y decisiones. Son una práctica simbólica para poner en marcha tu intención.
    - id: abundancia
      icono: tarot
      titulo: Rituales de abundancia y prosperidad
      resumen: Para enfocar tu intención en lo que querés que entre.
      descripcion: Rituales para trabajar la intención de prosperidad. Te acompañan a mirar qué querés sembrar; no reemplazan las acciones concretas ni garantizan resultados.
    - id: intencion
      icono: pnl
      titulo: La intención, lo más importante
      resumen: Qué querés que entre en tu casa y en tu vida.
      descripcion: Un ritual sin intención es un gesto vacío. Vas a aprender a ponerle palabras a lo que buscás y a repetirlo hasta que se vuelva un momento propio.

