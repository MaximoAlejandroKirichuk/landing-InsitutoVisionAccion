  titulo: Llevate el taller hoy
  destacado: PDF descargable · A tu ritmo · Certificado de participación
  texto: Pagás una sola vez y descargás el material. Además, en la tienda está la «Guía Práctica de Limpiezas Energéticas para el Hogar y el Aura» ($5.000), con sahumos, baños de descarga, sal, velas y sonidos. Es una práctica complementaria; no reemplaza la atención médica ni psicológica.
  precios:
    - periodo: Taller completo
      valores: [ARS 6.000]

preguntas:
  - pregunta: ¿Cómo es el taller?
    respuesta: Es un material en PDF que descargás y hacés a tu ritmo, sin horarios. Incluye certificado de participación.
  - pregunta: ¿Cuánto tiempo tengo para descargarlo?
    respuesta: Una vez habilitado el acceso, tenés 30 días para entrar a la plataforma y descargar el material. Después es tuyo.
  - pregunta: ¿Necesito experiencia previa?
    respuesta: No. Los rituales son simples y están explicados paso a paso, con elementos que tenés en casa o conseguís fácil.
  - pregunta: ¿Los rituales garantizan resultados?
    respuesta: No. Son prácticas simbólicas y de bienestar que te ayudan a poner en marcha una intención y a cuidar tus espacios. No reemplazan la atención médica ni psicológica.
  - pregunta: ¿Cómo lo compro?
    respuesta: Tocá «Quiero el taller» y dejá tus datos. Te escribimos por WhatsApp con las formas de pago.

