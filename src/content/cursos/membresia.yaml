  items:
    - titulo: 2 encuentros en vivo por semana
      texto: Lunes y jueves a las 19 h (Argentina), con Fernanda, online.
    - titulo: Catálogo de clases
      texto: Clases del instituto para mirar cuando quieras, a tu ritmo.
    - titulo: Espacio para tus dudas
      texto: Lo que te surja lo traés al encuentro y lo vemos en grupo.
    - titulo: Comunidad
      texto: Un grupo de personas en un camino parecido, que se acompañan semana a semana.

