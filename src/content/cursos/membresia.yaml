paraQuien:
  titulo: ¿Para quién es la membresía?
  items:
    - Empezás cursos o procesos con muchas ganas y, cuando no tenés con quién compartirlos, los dejás a la mitad.
    - Ya hiciste un camino de trabajo personal y querés sostenerlo en el tiempo, no quedarte en una sesión suelta.
    - Te cuesta pedir ayuda y te gustaría tener un lugar donde preguntar sin sentir que molestás.
    - Querés estar cerca del instituto y de Fernanda todas las semanas, a un valor accesible.
  cierre: Si te reconocés en alguna, la membresía es tu lugar en la semana.

programa:
  titulo: Cómo es un encuentro
  texto: Dos veces por semana nos vemos en vivo. Tocá cada parte para ver de qué se trata.
  enfoques:
    - id: llegar
      icono: coaching
      titulo: Llegás tal como estás
      resumen: No hace falta preparar nada.
      descripcion: Te conectás desde tu casa, lunes o jueves a las 19 h. Podés hablar o simplemente escuchar. Cada una se suma a su ritmo, y nadie te va a pedir que cuentes más de lo que querés contar.
    - id: practica
      icono: hipnosis
      titulo: Un tema y una práctica
      resumen: Fernanda propone algo para trabajar en el momento.
      descripcion: En cada encuentro Fernanda trae un tema y una práctica para hacer juntas, con herramientas de los distintos enfoques del instituto. La idea es que te lleves algo concreto para tu semana.
    - id: dudas
      icono: tarot
      titulo: Traés tus dudas
      resumen: Las vemos juntas, en grupo.
      descripcion: Lo que te quedó dando vueltas de una clase, de un curso o de tu propia historia lo podés traer al encuentro. Escuchar las preguntas de las demás también ayuda. Muchas veces alguien dice en voz alta lo que vos no te animabas a preguntar.
    - id: comunidad
      icono: biodescodificacion
      titulo: Un grupo que te espera
      resumen: Personas que están en un camino parecido al tuyo.
      descripcion: La membresía es, sobre todo, una comunidad. Saber que el lunes y el jueves hay un grupo que te espera hace más fácil sostener lo que empezaste.

incluye:
