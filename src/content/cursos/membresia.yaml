gancho:
  frase: Siempre pude sola. Pero hay cosas que ya no quiero seguir cargando sola.
  texto: Muchas venimos de historias donde pedir ayuda no era una opción, y aprendimos a sostener todo en silencio. Lo que se mira en grupo pesa distinto. No hace falta tener todo resuelto para llegar. Alcanza con querer un lugar donde no estés sola.

