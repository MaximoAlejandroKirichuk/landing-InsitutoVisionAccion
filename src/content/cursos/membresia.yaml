oferta:
  titulo: Sumate a la membresía
  destacado: Lunes y jueves, 19 h · En vivo con Fernanda
  texto: Es una membresía paga y mensual. No incluye certificado, porque es un espacio de práctica y comunidad, no una formación.
  precios:
    - periodo: Por mes
      valores: [$20.000 en Argentina, USD 20 desde el exterior]

preguntas:
  - pregunta: ¿Tengo que haber hecho algún curso del instituto antes?
    respuesta: No. La membresía es para cualquier persona que quiera un espacio fijo de trabajo personal en grupo. Si ya hiciste cursos, es una forma de sostener lo que empezaste.
  - pregunta: ¿Tengo que hablar en los encuentros?
    respuesta: Solo si querés. Podés participar escuchando, y hablar cuando te sientas cómoda.
  - pregunta: ¿Incluye certificado?
    respuesta: No. La membresía es un espacio de práctica y comunidad. Los cursos y formaciones del instituto tienen su propia certificación.
  - pregunta: ¿Cuánto cuesta y cómo se paga?
    respuesta: $20.000 por mes en Argentina o USD 20 desde el exterior. Tocá «Quiero sumarme», dejá tus datos y te escribimos por WhatsApp con los medios de pago.
  - pregunta: ¿Reemplaza una terapia?
    respuesta: No. Es un espacio de crecimiento personal en grupo y no reemplaza la atención médica ni psicológica.

cierre:
  titulo: El próximo encuentro puede ser el tuyo
  texto: Dejá tus datos y te escribimos por WhatsApp para contarte cómo sumarte. Es paga, $20.000 por mes.

reserva:
  titulo: Quiero sumarme a la membresía
  texto: Dejanos tus datos y te escribimos por WhatsApp con los pasos para inscribirte y los medios de pago.
  gracias: Te vamos a escribir para contarte cómo sumarte al próximo encuentro. Si querés, podés escribirnos ahora por WhatsApp con la palabra MEMBRESIA.

