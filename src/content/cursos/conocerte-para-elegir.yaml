paraQuien:
  titulo: ¿Para quién es este ebook?
  items:
    - Te cuesta estar en el presente porque la cabeza se te va a lo que pasó o a lo que podría pasar.
    - Siempre elegiste pensando en los demás, y hoy no tenés tan claro qué querés vos.
    - Hay frases que te repetís («ya es tarde», «no me lo merezco») y querés saber de dónde vienen.
    - Te hace bien escribir, o querés probar, y buscás ejercicios guiados.
    - Querés empezar a trabajar en vos con algo simple, a tu ritmo y a un precio accesible.
  cierre: Si te reconocés en alguna, este material es un buen comienzo.

programa:
  titulo: Qué vas a encontrar en el ebook
  texto: Cinco capítulos con lecturas guiadas, ejercicios de reflexión y propuestas de escritura consciente. Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: autoconocimiento
      icono: coaching
      titulo: Autoconocimiento
      resumen: Mirarte con honestidad y sin juzgarte.
      descripcion: Lecturas y ejercicios para reconocer cómo estás hoy, qué te importa y qué te quita energía. El punto de partida de todo lo demás.
    - id: culpa-y-preocupacion
      icono: hipnosis
      titulo: Entre el pasado y el futuro
      resumen: La culpa y la preocupación, mirándolas de frente.
      descripcion: Vas a reconocer cómo la culpa por lo que pasó y la preocupación por lo que viene influyen en lo que hacés hoy, y a practicar volver al presente.
    - id: creencias
      icono: pnl
      titulo: Creencias y pensamientos
      resumen: Las frases que deciden por vos.
      descripcion: Guías para identificar creencias y patrones que condicionan tu forma de vivir, con herramientas de coaching, PNL e inteligencia emocional para revisarlas.
    - id: journaling
      icono: coaching
      titulo: Escritura consciente
      resumen: El papel como espacio para pensar.
      descripcion: Propuestas de journaling para ordenar lo que sentís, ponerle palabras y verlo con más claridad. También incluye prácticas de mindfulness.
    - id: decisiones
      icono: coaching
      titulo: Propósito, metas y hábitos
      resumen: De lo que descubriste a lo que elegís.
      descripcion: Ejercicios para definir metas personales, tomar decisiones desde lo que te importa y sostenerlas con hábitos y liderazgo personal.

