preguntas:
  - pregunta: ¿Cómo lo compro?
    respuesta: Tocá «Quiero el ebook» y dejá tus datos. Te escribimos por WhatsApp con los datos para el pago y te habilitamos la descarga.
  - pregunta: ¿Cuánto tiempo tengo para descargarlo?
    respuesta: 30 días corridos desde que te habilitamos el acceso. Lo que descargues queda para tu uso personal; pasado ese plazo, la descarga desde la plataforma se cierra.
  - pregunta: ¿Cómo es la sesión de coaching?
    respuesta: Es una sesión individual de 30 minutos, online y sin costo adicional, una por persona. Se reserva con anticipación y depende de la agenda y de los cupos del mes.
  - pregunta: ¿Necesito experiencia previa?
    respuesta: No. Está pensado para empezar desde cero, con lecturas simples y ejercicios guiados.
  - pregunta: ¿Reemplaza una terapia?
    respuesta: No. Es un material de desarrollo personal. No reemplaza la atención médica ni psicológica.

