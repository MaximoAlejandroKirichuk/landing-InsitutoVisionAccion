gancho:
  frase: Vivo entre la culpa por lo que hice y el miedo por lo que viene.
  texto: Y en el medio se va el presente. No es que no sepas elegir. Es que muchas decisiones las tomás cargando el pasado o anticipando lo peor. Conocerte es el primer paso para elegir distinto, y se puede empezar con papel y lápiz.

