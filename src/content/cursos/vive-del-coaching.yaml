# La misma frase que usa el anuncio/Reel que trae a esta página.
gancho:
  frase: Me formé como coach… y todavía no sé por dónde empezar.
  texto: «¿A quién puedo acompañar?», «¿Cómo me doy a conocer?», «¿Estoy preparada para ofrecer mis servicios?». Son preguntas de casi todos los colegas al terminar la formación. Este ebook te ayuda a responderlas con ejercicios, no con fórmulas.

cursada:
  - etiqueta: Formato
    valor: Ebook en PDF de 92 páginas, en 12 módulos
  - etiqueta: Incluye
    valor: Hojas de trabajo y una Sesión de Claridad individual de 20 minutos
  - etiqueta: Ritmo
    valor: Lo leés y completás a tu tiempo
  - etiqueta: Acceso
    valor: 30 días para descargarlo; el archivo queda para vos

paraQuien:
  titulo: ¿Para quién es este ebook?
  items:
    - Estás estudiando coaching y querés empezar a pensar tus posibilidades profesionales.
    - Te recibiste hace poco y no sabés cómo empezar a ofrecer tus servicios.
    - Querés fortalecer tu autoconfianza y definir tu identidad profesional como coach.
    - Te cuesta elegir un nicho y saber a quién querés acompañar.
    - Querés armar un proyecto propio y ordenar tus primeros pasos.
    - Querés nociones iniciales de comunicación, marca personal y redes para presentar lo que hacés.
  cierre: No hace falta ser experto en marketing ni en negocios. Hace falta empezar a ordenar.

programa:
  titulo: Qué vas a trabajar
  texto: Doce módulos breves con explicaciones, ejemplos, preguntas de reflexión y actividades prácticas, en un único PDF. Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: identidad
      icono: coaching
      titulo: Tu identidad profesional
      resumen: Propósito, talentos, valores y fortalezas.
      descripcion: Ejercicios para reconocer qué te trajo al coaching, qué te distingue y desde dónde querés acompañar. Es la base para todo lo que viene después.
    - id: confianza
      icono: coaching
      titulo: Autoconfianza y merecimiento
      resumen: Los miedos y creencias que frenan el primer paso.
      descripcion: Vas a mirar las inseguridades típicas del inicio («todavía no estoy lista», «¿quién me va a elegir?») y a trabajarlas con preguntas de reflexión.
    - id: practica
      icono: coaching
      titulo: Tu desarrollo como coach
      resumen: Distinciones, buenas prácticas y errores frecuentes.
      descripcion: Un repaso de distinciones ontológicas, la estructura de una conversación de coaching, buenas prácticas y los errores más comunes al empezar. Más la importancia de la práctica, la mentoría y la supervisión.
    - id: posibilidades
      icono: coaching
      titulo: Posibilidades laborales
      resumen: Nichos, clientes posibles y formas de ofrecer tu servicio.
      descripcion: Vas a explorar a quién podrías acompañar, qué necesitan esas personas y distintas maneras de ofrecer tus servicios.
    - id: planificacion
      icono: coaching
      titulo: Herramientas de planificación
      resumen: Ikigai, Canvas, FODA, CAME y SMART.
      descripcion: Herramientas simples para ordenar tu proyecto profesional y convertirlo en objetivos y primeros pasos concretos.
    - id: comunicacion
      icono: coaching
      titulo: Comunicación profesional
      resumen: Oratoria, storytelling, marca personal y redes.
      descripcion: Nociones iniciales para contar lo que hacés con claridad y empezar a darte a conocer en redes sociales, sin volverte experto en marketing.

