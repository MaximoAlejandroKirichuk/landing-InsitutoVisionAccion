# PDF de 92 páginas en 12 módulos, hojas de trabajo, Sesión de Claridad individual de 20 min online (una por
# comprador, con reserva y sujeta a agenda), 30 días para descargar, autora Fernanda Rodríguez, $10.000 (antes $25.000).
# El sitio no publica los títulos de los 12 módulos: el programa agrupa los temas que sí lista.
#
# Público: NO es Lorena. Estudiantes de coaching y coaches recién recibidos que no saben cómo empezar a ejercer.
# Tono: profesional, entre colegas. Sin promesas de ingresos ni de clientes.

