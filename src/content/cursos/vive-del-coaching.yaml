# Bloque automático "Cómo es estudiar en el Instituto" (membresía y encuentros: src/data/instituto.ts)
instituto:
  recibis:
    - Ebook en PDF de 92 páginas, organizado en 12 módulos breves.
    - Hojas de trabajo, preguntas de reflexión y actividades prácticas para completar a tu ritmo.
    - Una Sesión de Claridad individual de 20 minutos, online y sin costo adicional, para conversar sobre tu proyecto (una por compra, con reserva previa y según agenda).
    - 30 días para descargar el PDF. Una vez descargado, es tuyo para uso personal.
  encuentros: El ebook es a tu ritmo, sin clases en vivo. Si querés practicar y conversar con colegas, sumate a los encuentros de la membresía.
  membresia: true

docentes:
  titulo: Quién lo escribió
  personas:
    - id: docente-fernanda
      nombre: Fernanda Rodríguez
      bio: Fundadora y directora del Instituto Visión en Acción, formadora de coaches. Escribió esta guía con las preguntas que más escucha de colegas recién recibidos, y es quien te acompaña en la Sesión de Claridad.
      foto: /images/instructor-portrait.jpg
      alt: Retrato de Fernanda Rodríguez
      ancho: 673
      alto: 1437

oferta:
  titulo: Disponible ahora
  destacado: Lo empezás hoy mismo
  texto: Es un ebook pago. Te escribimos por WhatsApp con los datos para el pago y te habilitamos la descarga y la reserva de tu Sesión de Claridad.
  precios:
    - periodo: Ebook Vive del Coaching con Propósito
      valores: [ARS 10.000, Incluye Sesión de Claridad de 20 min]

preguntas:
  - pregunta: ¿Cómo lo compro?
    respuesta: Tocá «Reservar mi lugar» y dejá tus datos. Te escribimos por WhatsApp con los pasos para pagar y te habilitamos la descarga.
  - pregunta: ¿Cuánto tiempo tengo para descargarlo?
    respuesta: 30 días corridos desde que se habilita el acceso. El archivo que descargues sigue siendo tuyo para uso personal.
  - pregunta: ¿Cómo es la Sesión de Claridad?
    respuesta: Es una conversación individual de 20 minutos, online y sin costo adicional, para mirar tu proyecto, reconocer qué te frena y explorar una primera acción. Es una por compra, con reserva previa y según disponibilidad de agenda; los cupos mensuales son limitados.
  - pregunta: ¿Me garantiza conseguir clientes o ingresos?
    respuesta: No. Es una guía de orientación profesional con ejercicios para ordenar tus primeros pasos. Lo que pase después depende de tu práctica y de cada proyecto.
  - pregunta: ¿Necesito saber de marketing o negocios?
    respuesta: No. El ebook trae nociones iniciales de comunicación y marca personal, pensadas para coaches que recién empiezan.
  - pregunta: ¿Es una formación en coaching?
    respuesta: No. Está pensado para quienes ya estudian o terminaron una formación en coaching. Si todavía no la hiciste, mirá la Academia de Coaching Ontológico del instituto.

cierre:
  titulo: Tu vocación puede ser el comienzo de un proyecto profesional
  texto: Dejá tus datos y te escribimos por WhatsApp para contarte cómo conseguir el ebook.

reserva:
  titulo: Quiero el ebook Vive del Coaching con Propósito
  texto: Dejanos tus datos y te escribimos por WhatsApp con los pasos para comprarlo y reservar tu Sesión de Claridad.
  gracias: Te vamos a escribir para contarte cómo pagar y habilitarte la descarga. Si querés, podés escribirnos ahora por WhatsApp.
