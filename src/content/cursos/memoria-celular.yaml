oferta:
  titulo: Reservá tu sesión
  destacado: Sesión individual · Agenda abierta
  texto: Coordinamos el día y el horario por WhatsApp. Esta práctica es complementaria y no sustituye la atención médica, psicológica o psiquiátrica.

preguntas:
  - pregunta: ¿Qué es la Memoria Celular?
    respuesta: Es un enfoque de exploración personal que parte de la idea de que el cuerpo guarda registro de lo que vivimos y de lo que vivieron antes que nosotras. En la sesión observamos experiencias, emociones y patrones que sentís presentes hoy.
  - pregunta: ¿Va a cambiar la relación con mis hijos?
    respuesta: No podemos prometerte cómo va a responder otra persona. Lo que sí podés hacer es mirar tu parte de la historia. La sesión es un espacio para vos.
  - pregunta: ¿Cuánto cuesta?
    respuesta: Es una sesión paga. Te pasamos el arancel por WhatsApp, junto con los horarios disponibles.
  - pregunta: ¿Reemplaza una terapia o un tratamiento médico?
    respuesta: No. Esta práctica es complementaria y no sustituye la atención médica, psicológica o psiquiátrica.
  - pregunta: ¿Cómo reservo?
    respuesta: Tocá «Reservar mi sesión» y dejá tus datos. Te escribimos por WhatsApp para coordinar el día.

cierre:
  titulo: El cambio no empieza por tus hijos. Empieza por vos.
  texto: Dejá tus datos y te escribimos para coordinar tu sesión de Memoria Celular.

reserva:
  titulo: Reservá tu sesión de Memoria Celular
  texto: Dejanos tus datos y te escribimos por WhatsApp con el arancel y los horarios disponibles.
  gracias: Te vamos a escribir para pasarte el arancel y coordinar el día. Si querés, podés escribirnos ahora por WhatsApp.
