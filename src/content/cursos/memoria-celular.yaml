# Sesiones de Memoria Celular → https://sitio/memoria-celular/
# Fuente: institutovisionenaccion.com/visiones-magicas/ (sesiones individuales, agenda abierta, sin precio publicado).
# Le hablamos a Lorena (README → "A quién le hablamos"). Sesión paga, sin promesas de resultado.

nombre: Sesiones de Memoria Celular
mostrarEnHome: false   # landing para anuncios
orden: 30
animacion: memoria-celular

seo:
  titulo: Sesiones de Memoria Celular | Instituto Visión en Acción
  descripcion: Sesión individual para explorar lo que tu historia dejó registrado y mirar de dónde viene lo que se repite en tu familia. Agenda abierta. Escribinos por WhatsApp.

tarjeta:
  etiqueta: Sesión individual · Agenda abierta
  resumen: Un espacio para explorar lo que tu historia dejó registrado y mirar de dónde viene lo que se repite.
  boton: Conocer la sesión

whatsapp:
  mensaje: Hola, quisiera conocer el arancel y los horarios disponibles para una sesión de Memoria Celular.

hero:
  bajada: Explorar lo que tu historia dejó registrado. Un espacio individual para mirar las emociones y los patrones que sentís presentes hoy, y de dónde vienen.
  datos:
    - Sesión individual
    - Agenda abierta
    - Es una sesión paga
  boton: Reservar mi sesión
  nota: Te escribimos por WhatsApp para pasarte el arancel y coordinar el día.
  linkSecundario:
    texto: Qué se mira en la sesión
    href: "#programa"

gancho:
  frase: Me duele ver que mis hijos repiten mis errores.
  texto: A veces reaccionamos con una fuerza que no tiene que ver con lo que pasó hoy. Lo que no miramos de nuestra historia, se repite en la de nuestros hijos. No es falta de amor. Es una herida que pasa de madre a hija, hasta que alguien decide mirarla. Y el cambio no empieza por tus hijos. Empieza por vos.

cursada:
  - etiqueta: Formato
    valor: Sesión individual, con agenda abierta
  - etiqueta: Modalidad y horario
    valor: Lo coordinamos con vos por WhatsApp
  - etiqueta: Arancel
    valor: Te lo pasamos por WhatsApp

paraQuien:
  titulo: ¿Para quién es esta sesión?
  items:
    - Ves que tus hijos repiten tus errores, y en eso reconocés algo que también viviste con tu mamá.
    - Hay reacciones tuyas que te desbordan y después no entendés de dónde salieron.
    - Te juraste que con tus hijos iba a ser distinto, y sentís que algo se sigue repitiendo.
    - Ya entendiste mucho con la cabeza y querés mirarlo desde otro lugar.
    - Decidiste empezar por vos, por tus hijos y por tus nietos.
  cierre: Si te reconocés en alguna, esta sesión es un buen primer paso.

programa:
  titulo: Qué podemos mirar en la sesión
  texto: Desde este enfoque, el cuerpo guarda memoria de lo que vivimos y de lo que vivieron antes que nosotras. Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: situaciones-que-se-repiten
      icono: biodescodificacion
      titulo: Situaciones que se repiten
      resumen: Lo que vuelve a pasar, en vos y en tu familia.
      descripcion: Esa historia que se repite de madre a hija, las mismas peleas, las mismas distancias. Miramos cuándo empezó y qué lugar ocupa hoy en tu vida.
    - id: emociones-del-pasado
      icono: hipnosis
      titulo: Emociones asociadas a experiencias pasadas
      resumen: Lo que sentís hoy, con raíz en otro momento.
      descripcion: El enojo, la tristeza o el miedo que aparecen con una fuerza que no tiene que ver con lo que pasó hoy. Exploramos de dónde vienen, sin juzgarlos.
    - id: creencias
      icono: coaching
      titulo: Creencias que hoy querés revisar
      resumen: Lo que aprendiste a pensar de vos y de los vínculos.
      descripcion: Frases que escuchaste de chica y que hoy siguen decidiendo por vos. Las miramos para que puedas elegir cuáles querés seguir sosteniendo.
    - id: vinculos
      icono: biodescodificacion
      titulo: Vínculos o decisiones que generan malestar
      resumen: Lo que duele en la relación con tus hijos, tu mamá o tu pareja.
      descripcion: Cuando tu hija te busca y le ponés excusas, o cuando sentís que te alejan. Miramos qué se activa en vos en esos momentos.
    - id: estancamiento
      icono: hipnosis
      titulo: Momentos de cambio o estancamiento
      resumen: Cuando sentís que no avanzás o que algo tiene que cambiar.
      descripcion: Una etapa nueva, un duelo, o la sensación de estar siempre en el mismo lugar. La sesión es un espacio para observarlo con calma.

