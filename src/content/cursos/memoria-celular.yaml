      alt: "Desde este enfoque, el cuerpo guarda memoria. De lo que vivimos, y de lo que vivieron antes que nosotras."
    - src: /images/carruseles/memoria-celular/4.webp
      alt: "Un ejercicio: la próxima vez que algo te desborde, preguntate: ¿cuándo sentí esto por primera vez?"
    - src: /images/carruseles/memoria-celular/5.webp
