paraQuien:
  titulo: ¿Para quién es este taller?
  items:
    - Te diste cuenta de que siempre pedís por los demás y casi nunca por vos.
    - Sentís que deseás mucho, pero no sabés bien por dónde empezar.
    - Querés probar distintas prácticas de intención y quedarte con las que te hacen bien.
    - Te gustan los rituales simples, que se pueden hacer en casa y en pocos minutos.
    - Estás empezando a explorar tu conexión con la energía, la intención y el propósito.
  cierre: Si te reconocés en alguna, este taller es una buena forma de empezar.

programa:
  titulo: Qué tipo de prácticas vas a encontrar
  texto: Son veinte métodos distintos, agrupados en cinco caminos. No hace falta hacerlos todos. Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: escritura
      icono: coaching
      titulo: La palabra escrita
      resumen: Poner en papel lo que querés, con claridad.
      descripcion: Prácticas de escritura en presente, cartas y listas de intención. Escribir ordena, y muchas veces recién ahí descubrimos qué deseamos de verdad.
    - id: visualizacion
      icono: hipnosis
      titulo: Visualización e imagen
      resumen: Ver con los ojos cerrados lo que todavía no está.
      descripcion: Ejercicios de visualización guiada y de tablero de visión, para darle forma a tu intención y volver a ella cada día.
    - id: voz
      icono: generico
      titulo: La voz y las afirmaciones
      resumen: Decirlo en voz alta, todos los días.
      descripcion: Afirmaciones y decretos diarios para nombrar lo que querés con tus propias palabras. Lo que se nombra, se empieza a mirar.
    - id: rituales
      icono: tarot
      titulo: Rituales simples
      resumen: Gestos pequeños para marcar un comienzo.
      descripcion: Velas, ciclos de la luna, gratitud y otros rituales sencillos para hacer en casa. Un momento tuyo, con intención.
    - id: accion
      icono: biodescodificacion
      titulo: Del deseo a la acción
      resumen: Un paso concreto detrás de cada intención.
      descripcion: Prácticas para bajar el deseo a tierra, con lo que podés hacer esta semana para acercarte. La intención se sostiene con hechos.

