preguntas:
  - pregunta: ¿Qué es manifestar?
    respuesta: Es una práctica de intención. Consiste en aclarar qué querés, ponerlo en palabras y acompañarlo con acciones concretas. No es magia ni una garantía de resultados.
  - pregunta: ¿Tengo que hacer los 20 métodos?
    respuesta: No. La idea es que pruebes distintas prácticas y te quedes con las que te hacen bien y podés sostener.
  - pregunta: ¿Necesito experiencia previa?
    respuesta: No. Está pensado para quienes están empezando a explorar la intención y el propósito.
  - pregunta: ¿Cuánto cuesta y cómo lo recibo?
    respuesta: Es pago, $6.000 en un único pago. Te escribimos por WhatsApp con el medio de pago y te enviamos el acceso al PDF por 30 días.
  - pregunta: ¿Reemplaza una terapia o un tratamiento médico?
    respuesta: No. Es una práctica de desarrollo personal y no sustituye la atención médica, psicológica o psiquiátrica.

