gancho:
  frase: Siempre pido por mis hijos. Nunca me pregunté qué quiero yo.
  texto: Muchas pasamos la vida sosteniendo a los demás y dejamos lo nuestro para después. Manifestar no es solo desear ni esperar que algo cambie afuera. Es aclarar qué querés, decirlo en voz alta y acompañarlo con una acción. Y eso también se practica.

