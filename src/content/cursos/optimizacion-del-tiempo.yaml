      valores: [ARS 16.000]

preguntas:
  - pregunta: ¿Cómo me inscribo?
    respuesta: Tocá «Reservar mi lugar» y dejá tus datos. Te escribimos por WhatsApp con los pasos para pagar y te habilitamos el acceso.
  - pregunta: ¿Las clases son en vivo?
    respuesta: No. El curso es online y a tu ritmo, con material descargable y un autotest por módulo. Si querés encuentros en vivo y comunidad, podés sumar la membresía.
  - pregunta: ¿Cuánto tiempo me lleva?
    respuesta: Depende de tu ritmo. Son 8 módulos pensados para leer y aplicar de a uno, mientras trabajás.
  - pregunta: ¿Recibo un certificado?
    respuesta: Sí, un certificado de participación del Instituto Visión en Acción. Es un certificado de formación privada no formal, no un título oficial.
  - pregunta: ¿Sirve para mi equipo o mi empresa?
    respuesta: El curso es individual. Si buscás algo para un equipo, el instituto ofrece coaching individual y grupal para líderes y equipos. Escribinos por WhatsApp y lo conversamos.

