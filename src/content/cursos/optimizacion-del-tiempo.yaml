# La misma frase que usa el anuncio/Reel que trae a esta página.
gancho:
  frase: Trabajo todo el día apagando incendios… y lo importante sigue esperando.
  texto: No es falta de esfuerzo ni de compromiso. Es que nadie nos enseñó a distinguir lo urgente de lo importante. Gestionar el tiempo es una habilidad, y se aprende.

cursada:
  - etiqueta: Modalidad
    valor: Online, con material descargable y ejercicios en cada módulo
  - etiqueta: Ritmo
    valor: Empezás cuando quieras y avanzás a tu tiempo
  - etiqueta: Evaluación
    valor: Un autotest al final de cada módulo
  - etiqueta: Certificado
    valor: Certificado de participación del instituto

paraQuien:
  titulo: ¿Para quién es este curso?
  items:
    - Profesionales y emprendedores que sienten que el día no les alcanza.
    - Líderes y mandos medios que pasan de reunión en reunión y no llegan a lo estratégico.
    - Freelancers y personas que trabajan desde casa y necesitan una estructura propia.
    - Personas con muchos roles (trabajo, familia, cuidados, proyectos) que quieren sostenerlos sin agotarse.
    - Quien posterga lo importante y quiere un método concreto para empezar.
  cierre: Si te reconocés en alguna, este curso está pensado para vos.

programa:
  titulo: Los 8 módulos
  texto: Cada módulo trae material descargable, ejemplos y un autotest para fijar lo aprendido. Van del sentido del tiempo a un plan de acción tuyo. Tocá cada uno para ver qué incluye.
  enfoques:
    - id: valor-del-tiempo
      icono: generico
      titulo: 1. El significado y el valor del tiempo
      resumen: Cómo percibís y usás tu tiempo hoy.
      descripcion: Qué quiere decir administrar (y liderar) tu tiempo, cómo lo percibimos y por qué el equilibrio entre las áreas de tu vida es el punto de partida.
    - id: importante-urgente
      icono: generico
      titulo: 2. Lo importante y lo urgente
      resumen: La matriz del tiempo para decidir qué va primero.
      descripcion: Los enfoques de gestión del tiempo, la matriz de cuadrantes para separar lo urgente de lo importante y por qué lo que sembrás hoy define lo que cosechás.
    - id: mision-personal
      icono: coaching
      titulo: 3. Tu misión personal
      resumen: Saber para qué, antes de organizar el cómo.
      descripcion: Autoconocimiento, equilibrio entre tus roles y un modelo de agenda semanal construido alrededor de lo que te importa, con aportes del coaching ontológico.
    - id: objetivos
      icono: coaching
      titulo: 4. Objetivos y metas
      resumen: De la intención a un objetivo medible.
      descripcion: Cómo formular objetivos, definir recursos y plazos, elegir indicadores de logro y pasarlos a actividades concretas en tu agenda.
    - id: planificacion
      icono: generico
      titulo: 5. Planificación diaria y semanal
      resumen: Tu agenda, tus herramientas y los ladrones de tiempo.
      descripcion: Elegir tu agenda (digital o en papel), "descargar la mente", detectar los ladrones del tiempo y planificar la jornada con el flujo de trabajo de David Allen.
    - id: reuniones
      icono: coaching
      titulo: 6. Reuniones eficaces
      resumen: Menos reuniones eternas, más decisiones.
      descripcion: Objetivo y orden del día, quién tiene que estar, logística, check-in y check-out, y qué le toca a quien lidera la reunión.
    - id: crecimiento
      icono: generico
      titulo: 7. Planificar tu crecimiento
      resumen: Un plan de acción que puedas sostener.
      descripcion: Definir el objetivo, los recursos tangibles e intangibles, cómo hacer el seguimiento y qué ajustar cuando el plan se desvía.
    - id: aplicacion
      icono: generico
      titulo: 8. Ejercicios y aplicación práctica
      resumen: Bajar todo a tu semana real.
      descripcion: La filosofía "slow down", el método ABCDE de Brian Tracy para priorizar y una evaluación personal de tus prioridades. Incluye herramientas adicionales de bonus.

