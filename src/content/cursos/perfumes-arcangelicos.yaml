preguntas:
  - pregunta: ¿Necesito saber de aromaterapia?
    respuesta: No. El taller es para todos los niveles y te guía paso a paso, desde elegir la intención hasta la activación del perfume.
  - pregunta: ¿Cómo es el formato?
    respuesta: Es un taller en PDF descargable. Lo hacés cuando quieras, sin horarios, y tenés 30 días para descargar el material.
  - pregunta: ¿Cuánto cuesta?
    respuesta: Es un taller pago de ARS 4.000. Te escribimos por WhatsApp para pasarte los datos de pago.
  - pregunta: ¿Recibo certificado?
    respuesta: Sí, al terminar recibís un certificado de participación del instituto.
  - pregunta: ¿Puedo ofrecer los perfumes como servicio?
    respuesta: Sí. Podés usarlo para tu crecimiento personal o sumarlo a tus sesiones y ofrecerlo como producto propio.

