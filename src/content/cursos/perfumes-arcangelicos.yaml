gancho:
  frase: Durante años cuidé de todos. Ahora quiero un momento que sea solo mío.
  texto: "Hay días en que cargamos con todo y nos olvidamos de nosotras. Un ritual pequeño, hecho con tus manos y con una intención clara, puede ser ese momento para frenar, respirar y volver a vos. No hace falta saber de aromaterapia: el taller te guía paso a paso."

