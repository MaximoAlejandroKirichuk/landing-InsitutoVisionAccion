paraQuien:
  titulo: ¿Para quién es este taller?
  items:
    - Querés regalarte un ritual propio, un momento del día que sea solo tuyo.
    - Te atrae el mundo de los ángeles y querés acercarte a él de una forma simple y concreta.
    - Te gustan los aromas y querés aprender a preparar algo con tus manos.
    - Hacés Reiki, terapias holísticas o trabajás en bienestar y querés sumar perfumes energéticos a tus sesiones.
    - Querés crear productos espirituales personalizados, para vos, para regalar o para ofrecer.
  cierre: Si te reconocés en alguna, este taller está pensado para vos.

programa:
  titulo: Qué vas a aprender
  texto: Tocá cada bloque para ver de qué se trata.
  enfoques:
    - id: conexion
      icono: hipnosis
      titulo: Conectar con los arcángeles a través del aroma
      resumen: Cada perfume, alineado con la energía de un arcángel.
      descripcion: Vas a conocer cómo se relaciona cada preparación con la frecuencia de un arcángel, para que tu perfume tenga un sentido y una intención desde el primer paso.
    - id: intencion
      icono: coaching
      titulo: Elegir tu intención
      resumen: Protección, amor, sanación o abundancia.
      descripcion: Antes de preparar, elegís para qué querés tu perfume. Aprendés a crear uno personalizado según la intención que quieras acompañar en este momento de tu vida.
    - id: esencias
      icono: biodescodificacion
      titulo: Las propiedades de cada esencia
      resumen: Aceites esenciales, esencias florales y esencias sagradas.
      descripcion: Conocés qué aporta cada esencia y cómo combinarlas para fortalecer la vibración de tu perfume.
    - id: preparacion
      icono: pnl
      titulo: La preparación, paso a paso
      resumen: De los frascos a tu perfume terminado.
      descripcion: Una guía ordenada para preparar el perfume en tu casa, con aceites esenciales y esencias florales, sin necesidad de experiencia previa.
    - id: activacion
      icono: tarot
      titulo: La activación energética
      resumen: El momento de cargar tu perfume con intención.
      descripcion: Aprendés a activar energéticamente el perfume para darle fuerza a tu intención, y cómo usarlo para elevar tu vibración, armonizar tu espacio y acompañar tus meditaciones.

incluye:
  titulo: Para qué podés usar tu perfume
  items:
    - titulo: En tu día a día
      texto: Como un pequeño ritual para empezar la mañana con otra energía.
    - titulo: En tu casa
      texto: Para purificar y armonizar tus espacios.
    - titulo: En tus prácticas
      texto: Para acompañar la meditación y tus momentos espirituales.
    - titulo: Como servicio
      texto: Si querés, podés ofrecerlo en tus sesiones o como producto propio.

