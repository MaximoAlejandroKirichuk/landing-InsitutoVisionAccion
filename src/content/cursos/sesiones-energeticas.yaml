    - src: /images/carruseles/sesiones-energeticas/5.webp
      alt: "Con cada exhalación, preguntate: ¿qué de todo esto que cargo es mío? No hace falta responder hoy."
    - src: /images/carruseles/sesiones-energeticas/6.webp
