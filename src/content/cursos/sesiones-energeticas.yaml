oferta:
  titulo: Reservá tu sesión
  destacado: Sesión individual · Agenda abierta
  texto: Coordinamos el día, el horario y la herramienta por WhatsApp. Esta práctica es complementaria y no sustituye la atención médica, psicológica o psiquiátrica.

preguntas:
  - pregunta: ¿Qué es una sesión energética?
    respuesta: Es un espacio individual en el que usamos herramientas como el Reiki, la Tameana, la Radiestesia o el péndulo para acompañarte a bajar el ritmo, escucharte y armonizarte. Se recibe en calma, sin esfuerzo de tu parte.
  - pregunta: ¿Tengo que elegir yo la herramienta?
    respuesta: No hace falta. Nos contás cómo estás y elegimos juntas la que mejor acompaña tu momento. Si ya tenés una preferencia, también la tenemos en cuenta.
  - pregunta: ¿Va a resolver lo que me pasa con mi familia?
    respuesta: No podemos prometerte cómo va a responder otra persona ni un resultado puntual. La sesión es un espacio para vos, para soltar un poco de lo que venís cargando.
  - pregunta: ¿Cuánto cuesta?
    respuesta: Es una sesión paga. Te pasamos el arancel por WhatsApp, junto con los horarios disponibles.
  - pregunta: ¿Reemplaza una terapia o un tratamiento médico?
    respuesta: No. Esta práctica es complementaria y no sustituye la atención médica, psicológica o psiquiátrica. Si estás en tratamiento, seguí con él.
  - pregunta: ¿Cómo reservo?
    respuesta: Tocá «Reservar mi sesión» y dejá tus datos. Te escribimos por WhatsApp para coordinar el día.

cierre:
  titulo: Antes de poder dar, a veces hace falta volver a vos.
  texto: Dejá tus datos y te escribimos para coordinar tu sesión energética.

reserva:
  titulo: Reservá tu sesión energética
  texto: Dejanos tus datos y te escribimos por WhatsApp con el arancel y los horarios disponibles.
  gracias: Te vamos a escribir para pasarte el arancel y coordinar el día. Si querés, podés escribirnos ahora por WhatsApp.
