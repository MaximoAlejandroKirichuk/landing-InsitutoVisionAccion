gancho:
  frase: Siento que cargo con un peso que no es mío.
  texto: Durante años sostuviste a todos. A tus hijos, a tu mamá, a tu casa. Y en el camino fuiste guardando cansancio, enojos y tristezas que nunca tuviste tiempo de mirar. No es debilidad. Es mucho tiempo cargando sola. Antes de poder dar, a veces hace falta parar y volver a vos.

cursada:
  - etiqueta: Formato
    valor: Sesión individual, con agenda abierta
  - etiqueta: Modalidad y horario
    valor: Lo coordinamos con vos por WhatsApp
  - etiqueta: Arancel
    valor: Te lo pasamos por WhatsApp

paraQuien:
  titulo: ¿Para quién es esta sesión?
  items:
    - Sentís que cargás con un peso que no es solo tuyo, y que viene de lejos.
    - Pasaste años cuidando a todos y casi nunca te diste un espacio para vos.
    - Andás cansada, con la cabeza llena, y te cuesta encontrar un momento de calma.
    - Te atraen las herramientas energéticas y querés vivirlas acompañada.
    - Decidiste empezar por vos, por tus hijos y por tus nietos.
  cierre: Si te reconocés en alguna, esta sesión es un buen primer paso.

programa:
  titulo: Las herramientas de la sesión
  texto: En cada sesión elegimos juntas la herramienta que mejor acompaña tu momento. Tocá cada una para ver de qué se trata.
  enfoques:
    - id: reiki
      icono: hipnosis
      titulo: Reiki
      resumen: Imposición de manos para relajarte y aquietar la mente.
      descripcion: Es una práctica de origen japonés. Te recostás, vestida, y recibís la imposición de manos en un ambiente tranquilo. Muchas personas la viven como un momento de relajación profunda y de pausa.
    - id: tameana
      icono: generico
      titulo: Tameana
      resumen: Una práctica energética suave, para armonizar y equilibrar.
      descripcion: Es una técnica de canalización energética que se recibe en calma, sin esfuerzo de tu parte. La usamos como un espacio de armonización y de encuentro con vos misma.
    - id: radiestesia
      icono: biodescodificacion
      titulo: Radiestesia
      resumen: Escuchar lo que se mueve en vos con instrumentos sencillos.
      descripcion: La radiestesia trabaja con instrumentos como el péndulo para explorar cómo te sentís y qué necesitás en este momento. Es una herramienta de observación, no de diagnóstico.
    - id: pendulo
      icono: tarot
      titulo: Péndulo
      resumen: Preguntas simples, respuestas para observar con calma.
      descripcion: Con el péndulo hacemos preguntas sobre lo que estás viviendo y miramos juntas lo que aparece. No adivina el futuro ni decide por vos; te ayuda a ponerle palabras a lo que sentís.
    - id: armonizacion
      icono: coaching
      titulo: Armonización energética
      resumen: Un cierre para salir más liviana de lo que llegaste.
      descripcion: Es el momento de la sesión para soltar tensiones, ordenar la energía y volver a tu día con más calma. Te llevás una práctica simple para repetir en casa.

