instituto:              # bloque "Cómo es estudiar en el Instituto", ajustado a una sesión
  titulo: Qué recibís y cómo seguir
  recibis:
    - Una sesión individual, solo para vos, con la herramienta que elijamos juntas para tu momento.
    - Día y horario coordinados por WhatsApp, según tu disponibilidad (agenda abierta).
    - Una práctica simple para seguir cuidando tu energía en casa.
  encuentros: Si después querés seguir acompañada, podés sumarte a los encuentros en vivo de la membresía. Es opcional.
  membresia: true

