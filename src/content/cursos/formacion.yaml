# Consultorio del Bienestar → https://sitio/formacion/
# Copiá _plantilla.yaml para armar un curso nuevo. El nombre del archivo es la URL.

nombre: Consultorio del Bienestar
orden: 1
planilla: formacion-bio-coaching

seo:
  titulo: Consultorio del Bienestar | Instituto Visión en Acción
  descripcion: Formación de 12 meses en vivo que integra coaching sistémico, constelaciones con tarot, biodescodificación, hipnosis y PNL. Reservá tu lugar en la próxima cursada.

tarjeta:
  etiqueta: Formación · 12 meses en vivo
  resumen: Aprendé a integrar cinco enfoques de acompañamiento mientras explorás tu propia historia.
  boton: Conocer la formación

whatsapp:
  mensaje: Hola, quisiera conocer el arancel y los pasos de inscripción para la formación Consultorio del Bienestar.

hero:
  bajada: Aprendé a integrar cinco enfoques de acompañamiento mientras explorás tu propia historia.
  datos:
    - 12 meses
    - Clases en vivo
    - Inicio en enero de 2027
  nota: Te escribimos para confirmar disponibilidad y explicarte cómo inscribirte.
  linkSecundario:
    texto: Conocer a los formadores
    href: "#docentes"
  imagen:
    src: /images/formation-sculpture-base.webp
    srcMobile: /images/formation-sculpture-base-mobile.webp
    esfera: true

# Frase de la clienta ideal (Lorena), la misma que usa el anuncio. Ver README → "A quién le hablamos".
gancho:
  frase: Me juré que con mis hijos iba a ser distinto.
  texto: Lo que no miramos de nuestra historia, se repite en la de nuestros hijos. No es falta de amor. Es una herida que pasa de generación en generación, hasta que alguien decide mirarla. El cambio no empieza por tus hijos. Empieza por vos.

cursada:
  - etiqueta: Modalidad
    valor: En vivo por Google Meet
  - etiqueta: Días y horario
    valor: Lunes y miércoles, 20 hs (Argentina)

paraQuien:
  titulo: ¿Para quién es esta formación?
  items:
    - Ves que en tu familia se repiten las mismas historias, de madre a hija, y querés entender de dónde vienen.
    - Querés mirar tu propia historia primero, para que tus hijos no hereden lo que a vos te dolió.
    - Ya acompañás a otras personas y buscás enfoques que complementen lo que hacés.
    - Hiciste talleres o cursos sueltos y te falta un recorrido que los integre.
  cierre: Si te reconocés en alguna, este recorrido está pensado para vos.

programa:
  titulo: Cinco enfoques en un solo recorrido
  texto: Cada bloque suma una mirada distinta sobre tu historia y sobre cómo acompañar a otras personas. Tocá cada enfoque para ver de qué se trata.
  enfoques:
    - id: coaching
      icono: coaching
      titulo: Coaching sistémico e integral
      resumen: Preguntas y escucha para acompañar a otras personas.
      descripcion: Exploración de la escucha, las preguntas y los vínculos.
    - id: tarot
      icono: tarot
      titulo: Constelaciones con Tarot
      resumen: Las cartas como apoyo para mirar vínculos e historias.
      descripcion: Uso simbólico de las cartas para reflexionar sobre vínculos e historias personales.
    - id: biodescodificacion
      icono: biodescodificacion
      titulo: Biodescodificación
      resumen: Cómo tu historia familiar se refleja en lo que vivís.
      descripcion: Presentación del enfoque y actividades de reflexión sobre creencias e historia familiar.
    - id: hipnosis
      icono: hipnosis
      titulo: Hipnosis y terapias de vidas pasadas
      resumen: Estados de relajación profunda para explorar tu historia.
      descripcion: Introducción a los enfoques que forman parte del recorrido.
    - id: pnl
      icono: pnl
      titulo: Programación neurolingüística (PNL)
      resumen: Cómo tus palabras y creencias guían lo que hacés.
      descripcion: Exploración del lenguaje, las creencias y los patrones de comunicación.

incluye:
  titulo: Qué incluye la formación
  items:
    - titulo: Grabaciones disponibles por 30 días
      texto: Podés volver a ver cada clase para repasar o recuperar un encuentro al que no pudiste asistir.
    - titulo: Material de estudio incluido
      texto: Podés descargar el material de estudio y guardarlo para consultarlo cuando lo necesites.
    - titulo: Evaluaciones y certificados
      texto: El arancel incluye los exámenes y la emisión de los certificados dentro de los plazos establecidos por el instituto.

