      nombre: Fernanda Rodríguez
      bio: Fundadora y directora del instituto, es formadora en desarrollo personal y en el área holística. Su trabajo integra herramientas de autoconocimiento y de exploración de patrones personales y familiares.
      foto: /images/instructor-portrait.jpg
      alt: Retrato de la formadora
      ancho: 673
      alto: 1437
    - id: formador-holistico
      nombre: Daniel Alberto Rodríguez
      bio: Formador del área holística. Su formación incluye tarot y oráculos, constelaciones familiares, biodescodificación, hipnosis y Reiki.
      foto: /images/holistic-instructor-portrait.jpg
      alt: Retrato de Daniel Alberto Rodríguez
      ancho: 171
      alto: 365
      encuadre: 50% 12%

oferta:
  titulo: Próxima cursada
  destacado: Enero de 2027 · Cupos limitados
  texto: Matrícula bonificada. Pagás del 1 al 10 de cada mes por transferencia bancaria en Argentina y PayPal desde el exterior.
  precios:
    - periodo: Enero a abril
      valores: [ARS 60.000 por mes en Argentina, USD 70 por mes desde el exterior]
    - periodo: Mayo a agosto
      valores: [ARS 70.000 por mes en Argentina, USD 80 por mes desde el exterior]
    - periodo: Septiembre a diciembre
      valores: [ARS 80.000 por mes en Argentina, USD 90 por mes desde el exterior]

preguntas:
  - pregunta: ¿Cómo me inscribo?
    respuesta: Tocá «Reservar mi lugar» y dejá tus datos. El instituto te contacta por WhatsApp con la disponibilidad y los pasos para inscribirte.
  - pregunta: ¿Hace falta experiencia previa?
    respuesta: Podés empezar desde cero. La formación también está abierta a coaches, facilitadores y personas que ya trabajan en el ámbito holístico.
  - pregunta: ¿Quién emite los certificados y qué requisitos tienen?
    respuesta: El Instituto Visión en Acción emite los certificados. Para obtenerlos, tenés que cumplir los requisitos académicos de cada formación, aprobar las evaluaciones teóricas y completar las prácticas obligatorias cuando correspondan. Son certificados de formación privada no formal.
  - pregunta: ¿La formación reemplaza la atención profesional?
    respuesta: La propuesta es educativa y de desarrollo personal. La formación no reemplaza la atención médica ni psicológica y no habilita por sí misma para ejercer una profesión de salud.

cierre:
  titulo: Empezá tu formación en la próxima cursada
  texto: Dejá tus datos y te escribimos para confirmar disponibilidad y explicarte cómo inscribirte.
