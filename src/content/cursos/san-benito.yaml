# Taller Poderes de San Benito → https://sitio/san-benito/
# Fuente: institutovisionenaccion.com/cursos/taller-los-poderes-milagrosos-de-san-benito/ (taller descargable,
# $6.000 con precio anterior $10.000, certificado de participación, técnicas para la vida diaria, protección y paz)
# y la tienda del instituto (material PDF con acceso por 30 días). El sitio no publica temario ni cantidad de páginas.
#
# Público: mujeres de fe que llevan la medalla, muchas veces Lorena. Tono calmo: protección y paz como práctica
# personal de fe. Sin "milagros" ni promesas de resultado. Es pago.

