oferta:
  titulo: Reservá tu sesión
  destacado: Sesión individual · Online
  texto: Coordinamos el día y el horario por WhatsApp. El coaching es un espacio de conversación y acción; no sustituye la atención psicológica, psiquiátrica ni médica.

preguntas:
  - pregunta: ¿Qué es una sesión de coaching?
    respuesta: Es una conversación individual con una coach para ordenar lo que querés, ver qué te frena y definir pasos concretos. No damos consejos ni decidimos por vos; te ayudamos a pensar con más claridad.
  - pregunta: ¿Tengo que tener claro el tema antes?
    respuesta: No hace falta. Podés llegar con una sensación («estoy trabada», «no sé qué quiero») y la ordenamos en la sesión.
  - pregunta: ¿Cuántas sesiones necesito?
    respuesta: Depende de lo que quieras trabajar. Podés empezar con una y decidir después si seguir. No hay paquetes obligatorios.
  - pregunta: ¿Cuánto cuesta?
    respuesta: Es una sesión paga. Te pasamos el arancel por WhatsApp, junto con los horarios disponibles.
  - pregunta: ¿Es lo mismo que una terapia?
    respuesta: No. El coaching mira hacia adelante y trabaja sobre objetivos y acciones. No sustituye la atención psicológica, psiquiátrica ni médica. Si estás en tratamiento, seguí con él.
  - pregunta: ¿Cómo reservo?
    respuesta: Tocá «Reservar mi sesión» y dejá tus datos. Te escribimos por WhatsApp para coordinar el día.

cierre:
  titulo: Empezar chico también es empezar.
  texto: Dejá tus datos y te escribimos para coordinar tu sesión de coaching.

reserva:
  titulo: Reservá tu sesión de coaching
  texto: Dejanos tus datos y te escribimos por WhatsApp con el arancel y los horarios disponibles.
  gracias: Te vamos a escribir para pasarte el arancel y coordinar el día. Si querés, podés escribirnos ahora por WhatsApp.
