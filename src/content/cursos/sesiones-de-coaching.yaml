gancho:
  frase: Sé lo que quiero cambiar. Lo que no sé es por dónde empezar.
  texto: No es falta de voluntad. Muchas veces es que todo parece igual de urgente, y la cabeza se traba. Una buena conversación ayuda a separar lo importante de lo que hace ruido, elegir una cosa y decidir el primer paso.

cursada:
  - etiqueta: Formato
    valor: Sesión individual, una a una
  - etiqueta: Modalidad
