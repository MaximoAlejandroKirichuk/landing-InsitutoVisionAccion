    valor: Lo coordinamos con vos por WhatsApp
  - etiqueta: Arancel
    valor: Te lo pasamos por WhatsApp

paraQuien:
  titulo: ¿Para quién son estas sesiones?
  items:
    - Tenés una decisión dando vueltas hace tiempo y querés pensarla con alguien de afuera.
    - Empezás cosas con ganas y las dejás a mitad de camino, una y otra vez.
    - Querés poner límites sin sentir culpa cada vez que decís que no.
    - Estás en una etapa nueva (trabajo, familia, hijos grandes) y querés definir qué sigue para vos.
    - Preferís algo concreto y práctico, con tareas para la semana.
  cierre: Si te reconocés en alguna, una sesión es un buen lugar para empezar.

programa:
  titulo: Qué podemos trabajar
  texto: Cada sesión parte de lo que traés. Estos son los temas más frecuentes. Tocá cada uno para ver cómo lo encaramos.
  enfoques:
    - id: objetivos
      icono: coaching
      titulo: Objetivos
      resumen: Pasar de «quiero cambiar» a algo que se pueda empezar.
      descripcion: Ponemos en palabras qué querés, por qué te importa y cómo te vas a dar cuenta de que avanzaste. Salís con un objetivo claro y un primer paso posible.
    - id: decisiones
      icono: pnl
      titulo: Decisiones
      resumen: Mirar las opciones con calma, sin la presión de resolver ya.
      descripcion: Ordenamos lo que está en juego en cada opción, qué te frena y qué valorás. La decisión siempre es tuya; la sesión te ayuda a tomarla con más claridad.
    - id: habitos
      icono: generico
      titulo: Hábitos
      resumen: Sostener algo en el tiempo, no solo arrancarlo.
      descripcion: Miramos qué pasó las veces que lo intentaste, achicamos el paso hasta que entre en un día común y armamos un seguimiento simple para la semana.
    - id: confianza
      icono: hipnosis
      titulo: Confianza
      resumen: Las frases que te frenan, miradas de frente.
      descripcion: Reconocemos las ideas que te repetís («ya es tarde», «no me sale») y de dónde vienen, y practicamos otras formas de hablarte que te dejen actuar.
    - id: limites
      icono: biodescodificacion
      titulo: Límites
      resumen: Decir que no sin pelearte ni sentir culpa.
      descripcion: Identificamos dónde se te va la energía, qué querés cuidar y cómo decirlo. Preparamos juntas las conversaciones que te cuestan.

