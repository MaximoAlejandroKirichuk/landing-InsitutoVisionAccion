# Sesiones de Coaching personalizadas → https://sitio/sesiones-de-coaching/
# Fuente: institutovisionenaccion.com ("Sesiones de Coaching personalizadas": online, individuales).
# El sitio no publica precio, duración ni quién las da. Sin precio → arancel por WhatsApp.
# Docentes: ante la duda, Fernanda y Daniel (pedido de Maximo, 27/11/2026).
# Tono adulto y concreto: objetivos, decisiones, hábitos, confianza, límites. Sin promesas de resultado.

